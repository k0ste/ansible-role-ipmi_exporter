---
- name: "ipmi_exporter | Deploy ipmi_exporter options configuration [package
    deployment]"
  ansible.builtin.template:
    src: "ipmi_exporter.options.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ipmi_exporter_options_dest') }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 'ipmi_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ipmi_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ipmi_exporter_install_package', default='')) == 'true'"
  vars:
    ipmi_exporter_install_package: "[] |
      map(&install_package || 'false', @) | [0]"
  notify:
    - "Restart ipmi_exporter"
- name: "ipmi_exporter | Deploy ipmi_exporter modules [package deployment]"
  ansible.builtin.template:
    src: "ipmi_exporter.yml.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ipmi_exporter_yaml_dest') }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 'ipmi_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ipmi_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ipmi_exporter_install_package', default='')) == 'true'"
  vars:
    ipmi_exporter_install_package:
      "[] | map(&install_package || 'false', @) | [0]"
  notify:
    - "Restart ipmi_exporter"
- name: "ipmi_exporter | Deploy ipmi_exporter modules [not package deployment]"
  ansible.builtin.template:
    src: "ipmi_exporter.yml.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ipmi_exporter_dest') +
      '/ipmi_exporter.yml' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 'ipmi_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ipmi_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ipmi_exporter_install_package', default='')) == 'false'"
  vars:
    ipmi_exporter_install_package:
      "[] | map(&install_package || 'false', @) | [0]"
  notify:
    - "Restart ipmi_exporter"
- name: "ipmi_exporter | Deploy ipmi_exporter service configuration [not
    package deployment]"
  ansible.builtin.template:
    src: "ipmi_exporter.service.j2"
    dest: "{{ '/etc/systemd/system/' + lookup('ansible.builtin.vars',
      'ipmi_exporter_service') + '.service' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 'ipmi_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ipmi_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ipmi_exporter_install_package', default='')) == 'false'"
  vars:
    ipmi_exporter_install_package: "[] |
      map(&install_package || 'false', @) | [0]"
  notify:
    - "Daemon reload"
    - "Restart ipmi_exporter"
- name: "ipmi_exporter | Enable ipmi_exporter service"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'ipmi_exporter_service') }}"
    enabled: "yes"
  when:
    - "lookup('ansible.builtin.vars', 'ipmi_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ipmi_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ipmi_exporter_enable', default='')) == 'true'"
  vars:
    ipmi_exporter_enable: "[] | map(&enable || 'false', @) | [0]"
